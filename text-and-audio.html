<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22%D0%90%D1%88-%D0%A8%D0%B8%D1%84%D0%B0%D1%85%D0%B8%D1%8F%22%3E%0A%20%20%3C!--%20The%20letter%20shin%20drawn%20as%20paths%20rather%20than%20text%3A%20a%20favicon%20cannot%20rely%20on%0A%20%20%20%20%20%20%20the%20viewer%27s%20system%20carrying%20an%20Arabic%20font.%20--%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23176b55%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23faf8f2%22%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2221%22%20cy%3D%2221%22%20r%3D%224%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2215%22%20r%3D%224%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2243%22%20cy%3D%2221%22%20r%3D%224%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Cpath%20d%3D%22M13%2032c0%2010%208%2017%2019%2017s19-7%2019-17%22%0A%20%20%20%20%20%20%20%20fill%3D%22none%22%20stroke%3D%22%23faf8f2%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E%0A">
  <title>Аш-Шифахия — текст и аудио</title>
  <link rel="stylesheet" href="./text-and-audio/player.css?v=4">
</head>
<body>
  <main class="listening-view">
    <nav><a href="./">← К курсу</a><label>Урок <select id="lesson" aria-label="Выбрать урок"></select></label></nav>
    <h1 id="lesson-label">Шифахия</h1>
    <p id="status" role="status">Загрузка урока…</p>
    <section class="listening-player" aria-label="Плеер" hidden>
      <div class="player-bar">
        <audio controls preload="metadata"></audio>
        <button id="settings-toggle" aria-label="Настройки" title="Настройки" aria-expanded="false" aria-controls="player-settings">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9.5 3-.5 2a7 7 0 0 0-2 1.2L5 5.7 2.5 10l1.5 1.5a7 7 0 0 0 0 2L2.5 15 5 19.3l2-.5A7 7 0 0 0 9 20l.5 2h5l.5-2a7 7 0 0 0 2-1.2l2 .5 2.5-4.3-1.5-1.5a7 7 0 0 0 0-2L21.5 10 19 5.7l-2 .5A7 7 0 0 0 15 5l-.5-2Z"/>
            <circle cx="12" cy="12.5" r="3"/>
          </svg>
        </button>
      </div>
      <p id="audio-error" role="alert" hidden>Не удалось загрузить запись. <button id="retry">Попробовать ещё раз</button></p>
      <div id="player-settings" hidden>
        <div class="controls">
          <button id="rewind" aria-label="Назад на 10 секунд">−10 с</button>
          <button id="forward" aria-label="Вперёд на 10 секунд">+10 с</button>
          <label>Скорость <select id="rate"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="0.9">0,9×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></label>
          <button id="loop" aria-pressed="false">Повтор записи</button>
        </div>
        <div class="controls text-controls">
          <button id="text-toggle" aria-expanded="true" aria-controls="listening-transcript">Скрыть текст</button>
          <button id="vowels" aria-pressed="true">Огласовки</button>
          <button id="smaller" aria-label="Уменьшить текст">А−</button>
          <button id="larger" aria-label="Увеличить текст">А+</button>
        </div>
      </div>
    </section>
    <article id="listening-transcript" lang="ar" dir="rtl" hidden></article>
    <p id="hidden-note" hidden>Слушайте и повторяйте вслух. Текст можно открыть в любой момент.</p>
    <section class="listening-completion" aria-label="Прогресс текста и аудио" hidden>
      <button id="complete" aria-pressed="false" disabled>Текст и аудио пройдены</button>
      <p id="completion-status" role="status"></p>
      <p id="offline-progress-note" hidden>Отметка в скачанном файле не переносится на сайт автоматически.</p>
    </section>
    <footer hidden><button id="download">Скачать урок для занятий без интернета</button><a id="audio-download" download>Скачать MP3</a><p id="download-status" role="status"></p></footer>
  </main>
  <script src="./text-and-audio/player.js?v=4" defer></script>
</body>
</html>
