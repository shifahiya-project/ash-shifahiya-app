# Rebuilds the podcast catalogue from YouTube once a week and offers it as a
# pull request.
#
# The site is static files, so the episode list cannot be fetched when a page is
# opened — it has to be built in advance and committed. Doing that by hand means
# the list quietly goes stale, and a stale list means the app runs out of
# unwatched episodes, so it is rebuilt on a schedule instead.
#
# A pull request rather than a push to main, because main is protected by the
# «protect main branches» ruleset and GitHub Actions cannot be granted a bypass
# in it. That turns out to suit the job: the diff shows which episodes appeared,
# and merging is what publishes the site — a merge is an ordinary push by a
# person, so deploy.yml starts on its own.
name: Refresh podcasts

on:
  schedule:
    # Monday morning: the channels publish through the week, and a list a few
    # days old costs nothing — the app only needs one unwatched episode a day.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two refreshes at once would race for the same branch.
concurrency:
  group: refresh-podcasts
  cancel-in-progress: false

env:
  # One standing branch rather than a dated one: a refresh nobody merged last
  # week should be replaced by this week's, not queued behind it.
  BRANCH: podcasts/refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # A scheduled job nobody is watching should say plainly why it failed,
      # rather than leaving a Russian stack trace in a collapsed log.
      - name: Check the API key is configured
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -eu
          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            echo "::error::Секрет YOUTUBE_API_KEY не задан. Settings → Secrets and variables → Actions → New repository secret. Ключ выпускается в Google Cloud Console с включённым YouTube Data API v3."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import the episodes
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run podcasts:import

      # The catalogue is what the app offers a learner, so a refresh that breaks
      # its shape must not even reach a pull request.
      - run: npm test

      - name: Offer the refreshed catalogue as a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if git diff --quiet -- content/podcasts/catalog.ts; then
            echo "Каталог не изменился — предлагать нечего."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/podcasts/catalog.ts
          git commit -m "Refresh the podcast catalogue"
          # The branch carries one generated commit on top of main and nothing
          # else, so it is replaced whole rather than added to.
          git push --force origin "$BRANCH"

          # One line per episode in the generated file, and one handle per
          # channel; both are cheaper to count here than to thread out of the
          # importer, and they are what the reviewer actually wants to know.
          episodes=$(grep -c '^    { id: ' content/podcasts/catalog.ts || true)
          channels=$(grep -c '^      handle: ' content/podcasts/catalog.ts || true)

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Открытый pull request обновлён свежим каталогом: $episodes выпусков."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Обновить каталог подкастов" \
            --body "$(printf '%s\n' \
              'Каталог пересобран из YouTube заданием `Refresh podcasts`.' \
              '' \
              "- выпусков: $episodes" \
              "- каналов: $channels" \
              '' \
              'Тесты прошли до создания ветки, так что форма каталога проверена.' \
              'Мерж этого PR публикует сайт со свежим списком.')"
