name: Validate menu simplification

on:
  push:
    branches: [fix/simplify-menu-20261014]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:static
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/smoke-home.mjs
